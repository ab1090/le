<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lesson Details</title>
    <link rel="stylesheet" href="lesson.css" />
  </head>
  <body class="lesson">
    <header class="site-header">
      <div class="container">
        <a class="breadcrumb" href="index.html">← Back to catalog</a>
        <h1 id="lesson-title">Lesson</h1>
        <p id="lesson-summary" class="lede"></p>
        <dl class="meta">
          <div>
            <dt>Audience</dt>
            <dd id="lesson-audience">—</dd>
          </div>
          <div>
            <dt>Duration</dt>
            <dd id="lesson-duration">—</dd>
          </div>
          <div>
            <dt>Tags</dt>
            <dd id="lesson-tags">—</dd>
          </div>
        </dl>
      </div>
    </header>

    <main class="container lesson-layout">
      <section class="lesson-section" id="prerequisites-section">
        <h2>Prerequisites</h2>
        <ul id="prerequisites" class="prerequisites-list"></ul>
      </section>

      <section class="lesson-section" id="learning-model-section">
        <h2>Learning Model</h2>
        <div id="learning-model" class="learning-model"></div>
      </section>

      <section class="lesson-section" id="pillars-section">
        <h2>Competency Pillars</h2>
        <div id="pillars" class="pillars"></div>
      </section>

      <section class="lesson-section" id="integration-project-section">
        <h2>Integration Project</h2>
        <div id="integration-project" class="integration-project"></div>
      </section>

      <section class="lesson-section" id="reflection-section">
        <h2>Reflection</h2>
        <div id="reflection" class="reflection"></div>
      </section>
    </main>

    <div id="lesson-status" role="status" class="status" hidden></div>

    <script>
      const $ = (id) => document.getElementById(id);

      const statusEl = $('lesson-status');
      const setStatus = (message, modifier = '') => {
        statusEl.textContent = message;
        statusEl.className = modifier ? `status status--${modifier}` : 'status';
        statusEl.hidden = false;
      };

      const hideStatus = () => {
        statusEl.hidden = true;
      };

      const params = new URLSearchParams(window.location.search);
      const lessonSlug = params.get('lesson');

      if (!lessonSlug) {
        setStatus('No lesson selected. Return to the catalog to choose a lesson.', 'error');
      } else {
        const manifestUrl = 'public/lessons/manifest.json';
        setStatus('Loading lesson…', 'loading');

        fetch(manifestUrl)
          .then((response) => {
            if (!response.ok) {
              throw new Error('Unable to load lesson manifest.');
            }
            return response.json();
          })
          .then((manifest) => {
            const entry = Array.isArray(manifest)
              ? manifest.find((item) => item.slug === lessonSlug)
              : null;

            if (!entry) {
              throw new Error('Lesson not found. It may have been moved or unpublished.');
            }

            const title = entry.title || 'Lesson';
            $('lesson-title').textContent = title;
            $('lesson-summary').textContent = entry.summary || '';
            $('lesson-duration').textContent = entry.duration || 'Self-paced';
            $('lesson-tags').textContent = Array.isArray(entry.tags) && entry.tags.length
              ? entry.tags.join(', ')
              : 'General';
            document.title = `${title} · Lesson Details`;

            return fetch(entry.path);
          })
          .then((response) => {
            if (!response.ok) {
              throw new Error('Unable to load lesson content.');
            }
            return response.json();
          })
          .then((lesson) => {
            $('lesson-audience').textContent = lesson.audience || 'Advanced learners';
            renderPrerequisites(lesson.prerequisites);
            renderLearningModel(lesson.learningModel);
            renderPillars(lesson.competencyPillars);
            renderIntegrationProject(lesson.integrationProject);
            renderReflection(lesson.reflection);
            hideStatus();
          })
          .catch((error) => {
            console.error(error);
            setStatus(error.message || 'Unable to display lesson details.', 'error');
          });
      }

      function renderPrerequisites(prerequisites) {
        const listEl = $('prerequisites');
        listEl.innerHTML = '';
        if (!Array.isArray(prerequisites) || prerequisites.length === 0) {
          const emptyItem = document.createElement('li');
          emptyItem.textContent = 'No formal prerequisites. Bring your curiosity!';
          listEl.appendChild(emptyItem);
          return;
        }

        prerequisites.forEach((item) => {
          const li = document.createElement('li');
          const title = document.createElement('h3');
          title.textContent = item.title || 'Preparation';
          const description = document.createElement('p');
          description.textContent = item.description || '';
          li.appendChild(title);
          li.appendChild(description);
          listEl.appendChild(li);
        });
      }

      function renderLearningModel(model) {
        const container = $('learning-model');
        container.innerHTML = '';
        if (!model || typeof model !== 'object') {
          container.textContent = 'This lesson follows a self-guided exploration model.';
          return;
        }

        const entries = [
          ['Framing', model.framing],
          ['Core Activity', model.coreActivity],
          ['Feedback & Iteration', model.feedback],
          ['Transfer', model.transfer],
        ];

        entries
          .filter(([, value]) => value)
          .forEach(([label, value]) => {
            const block = document.createElement('article');
            block.className = 'practice-card';
            const heading = document.createElement('h3');
            heading.textContent = label;
            const body = document.createElement('p');
            body.textContent = value;
            block.appendChild(heading);
            block.appendChild(body);
            container.appendChild(block);
          });

        if (!container.children.length) {
          container.textContent = 'This lesson follows a self-guided exploration model.';
        }
      }

      function renderPillars(pillars) {
        const container = $('pillars');
        container.innerHTML = '';
        if (!Array.isArray(pillars) || pillars.length === 0) {
          container.textContent = 'Competency pillars will be published soon.';
          return;
        }

        pillars.forEach((pillar, index) => {
          const block = document.createElement('article');
          block.className = 'pillar';
          const heading = document.createElement('h3');
          heading.textContent = pillar.name || `Pillar ${index + 1}`;
          const description = document.createElement('p');
          description.textContent = pillar.description || '';
          block.appendChild(heading);
          block.appendChild(description);

          if (Array.isArray(pillar.outcomes) && pillar.outcomes.length) {
            const list = document.createElement('ul');
            list.className = 'pillar__outcomes';
            pillar.outcomes.forEach((outcome) => {
              const item = document.createElement('li');
              item.textContent = outcome;
              list.appendChild(item);
            });
            block.appendChild(list);
          }

          container.appendChild(block);
        });
      }

      function renderIntegrationProject(project) {
        const container = $('integration-project');
        container.innerHTML = '';
        if (!project || typeof project !== 'object') {
          container.textContent = 'Integration project details coming soon.';
          return;
        }

        if (project.overview) {
          const overview = document.createElement('p');
          overview.textContent = project.overview;
          container.appendChild(overview);
        }

        if (Array.isArray(project.iterations) && project.iterations.length) {
          const list = document.createElement('ol');
          list.className = 'project-iterations';
          project.iterations.forEach((iteration) => {
            const item = document.createElement('li');
            const title = document.createElement('h3');
            title.textContent = iteration.title || 'Iteration';
            const summary = document.createElement('p');
            summary.textContent = iteration.objective || '';
            item.appendChild(title);
            item.appendChild(summary);

            if (Array.isArray(iteration.tasks) && iteration.tasks.length) {
              const tasks = document.createElement('ul');
              tasks.className = 'task-list';
              iteration.tasks.forEach((task) => {
                const taskItem = document.createElement('li');
                taskItem.textContent = task;
                tasks.appendChild(taskItem);
              });
              item.appendChild(tasks);
            }

            list.appendChild(item);
          });
          container.appendChild(list);
        }

        if (!container.children.length) {
          container.textContent = 'Integration project details coming soon.';
        }
      }

      function renderReflection(reflection) {
        const container = $('reflection');
        container.innerHTML = '';
        if (!reflection || typeof reflection !== 'object') {
          container.textContent = 'Use this space to capture takeaways and next steps.';
          return;
        }

        if (reflection.description) {
          const description = document.createElement('p');
          description.textContent = reflection.description;
          container.appendChild(description);
        }

        if (Array.isArray(reflection.prompts) && reflection.prompts.length) {
          const list = document.createElement('ul');
          list.className = 'reflection-prompts';
          reflection.prompts.forEach((prompt) => {
            const item = document.createElement('li');
            item.textContent = prompt;
            list.appendChild(item);
          });
          container.appendChild(list);
        }

        if (!container.children.length) {
          container.textContent = 'Use this space to capture takeaways and next steps.';
        }
      }
    </script>
  </body>
</html>
